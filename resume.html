<script>
function getQSVar(val) {
  const query = window.location.search.substring(1);
  let vars = query.split("&");
  for (let i = 0; i < vars.length; i++) {
    let pair = vars[i].split("=");
    if (pair[0] == val) {
      return pair[1];
    }
  }
  return false;
}

let pdf;
if (getQSVar("pdf")) {
  pdf = getQSVar("pdf");
  document.getElementById("pdf_viewer").src = pdf + "#view=fitH";
}
</script>
